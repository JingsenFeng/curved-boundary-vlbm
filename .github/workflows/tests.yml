name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WARP_DEVICE: cpu
      MPLBACKEND: Agg
      XLB_NEUMANN_SOLVER: newton
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Static checks
        run: ruff check .
      - name: Numerical and plotting tests
        run: python -m pytest -q
      - name: Check all paper commands
        run: python cases/reproduce.py --dry-run --device cpu
      - name: Build distribution
        run: python -m build
