[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curved-boundary-vlbm"
version = "1.0.0"
description = "Total-Lagrangian vectorial lattice Boltzmann solvers for hyperelasticity with curved boundaries"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Jingsen Feng"}, {name = "Xu Chu"}]
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "warp-lang==1.10.1"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
render = ["pyvista>=0.46,<0.47", "vtk>=9.4,<9.6"]
test = ["pytest>=8,<10", "ruff>=0.14,<0.15", "build>=1.2,<2"]

[project.urls]
Repository = "https://github.com/JingsenFeng/curved-boundary-vlbm"
Documentation = "https://github.com/JingsenFeng/curved-boundary-vlbm/tree/main/docs"
Issues = "https://github.com/JingsenFeng/curved-boundary-vlbm/issues"
Data = "https://doi.org/10.5281/zenodo.20572218"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["cases", "plotting"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F821", "F822", "F823", "E9"]
